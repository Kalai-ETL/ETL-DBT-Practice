version: 2

models:
  - name: emp
    columns:

      - name: emp_id
        data_tests:
          - not_null
          - unique

      - name: emp_name
        data_tests:
          - not_null
          - unique

      - name: designation
        data_tests:
          - not_null

      - name: department
        data_tests:
          - accepted_values:
              arguments:
                values: ['IT', 'Finance', 'HR']

      - name: salary
        data_tests:
          - not_null

      - name: manager_id
        data_tests:
          - relationships:
              arguments:
                to: ref('emp')
                field: emp_id

      - name: salary
        data_tests:
          - is_positive 

      - name: updated_dt
        data_tests:
          - Check_dates

      - name: designation
        data_tests:
          - no_empty_string    

      - name: email_id 
        data_tests:
          - email_check    